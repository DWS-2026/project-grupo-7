spring.application.name=academy

# Use in-memory database
spring.datasource.url=jdbc:mysql://localhost:3306/rayokrossAcademy
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# This automatically creates the tables in RAM.
spring.jpa.hibernate.ddl-auto=update

# Default port for HTTPS
server.port=8443

# Configuración SSL
server.ssl.key-store=classpath:keystore.jks
server.ssl.key-store-password=${SSL_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=rayokross

#Mustache recognition on .html
spring.mustache.suffix=.html

#Activate this block when the app ends and delete the one above.
server.error.include-exception=false
server.error.include-stacktrace=never
server.error.include-message=never
logging.level.web=INFO

# Force UTF-8 encoding on the server and in Mustache
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.mustache.charset=UTF-8

admin.default.password=${ADMIN_PASSWORD}
student.default.password=${STUDENT_PASSWORD}

# Files size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging configuration
logging.file.name=logs/academy-security.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %replace(%msg){'[\\r\\n]', '_'}%n
logging.level.com.rayokross.academy=INFO
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30