openapi: 3.0.1
info:
  title: OpenAPI definition
  version: v0
servers:
- url: https://localhost:8443
  description: Generated server url
paths:
  /api/v1/users/{id}:
    get:
      tags:
      - admin-user-rest-controller
      operationId: getUserProfile
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserDTO'
    put:
      tags:
      - admin-user-rest-controller
      operationId: editUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserBasicDTO'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserDTO'
    delete:
      tags:
      - admin-user-rest-controller
      operationId: deleteUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
  /api/v1/users/me:
    get:
      tags:
      - user-rest-controller
      operationId: getMyProfile
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserDTO'
    put:
      tags:
      - user-rest-controller
      operationId: updateMyProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserBasicDTO'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserDTO'
  /api/v1/users/me/media:
    get:
      tags:
      - user-rest-controller
      operationId: downloadImage
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: binary
    put:
      tags:
      - user-rest-controller
      operationId: uploadPhoto
      requestBody:
        content:
          application/json:
            schema:
              required:
              - photo
              type: object
              properties:
                photo:
                  type: string
                  format: binary
      responses:
        "200":
          description: OK
  /api/v1/courses/{id}:
    get:
      tags:
      - course-rest-controller
      operationId: getCourse
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CourseDetailDTO'
    put:
      tags:
      - admin-course-rest-controller
      operationId: updateCourse
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseBasicDTO'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CourseDetailDTO'
    delete:
      tags:
      - admin-course-rest-controller
      operationId: deleteCourse
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
  /api/v1/enrollments/{courseId}:
    post:
      tags:
      - enrollment-rest-controller
      operationId: enrollCurrentUser
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EnrollmentDTO'
  /api/v1/courses:
    get:
      tags:
      - course-rest-controller
      operationId: getCatalog
      parameters:
      - name: level
        in: query
        required: false
        schema:
          type: string
      - name: pageable
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Pageable'
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PageCourseBasicDTO'
    post:
      tags:
      - admin-course-rest-controller
      operationId: createCourse
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseBasicDTO'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CourseDetailDTO'
  /api/v1/courses/{id}/syllabus:
    get:
      tags:
      - course-rest-controller
      operationId: downloadSyllabus
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: binary
    post:
      tags:
      - admin-course-rest-controller
      operationId: uploadSyllabus
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              required:
              - syllabusFile
              type: object
              properties:
                syllabusFile:
                  type: string
                  format: binary
      responses:
        "200":
          description: OK
  /api/v1/courses/{id}/media:
    get:
      tags:
      - course-rest-controller
      operationId: getCourseImage
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: binary
    post:
      tags:
      - admin-course-rest-controller
      operationId: uploadImage
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              required:
              - imageFile
              type: object
              properties:
                imageFile:
                  type: string
                  format: binary
      responses:
        "200":
          description: OK
  /api/v1/courses/{courseId}/lessons:
    get:
      tags:
      - course-player-rest-controller
      operationId: getCoursePlayer
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CourseProgressDTO'
    post:
      tags:
      - lesson-rest-controller
      operationId: addLesson
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonDTO'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LessonDTO'
  /api/v1/cart/checkout:
    post:
      tags:
      - cart-rest-controller
      operationId: checkout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutDTO'
        required: true
      responses:
        "200":
          description: OK
  /api/v1/auth/register:
    post:
      tags:
      - auth-rest-controller
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationDTO'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserDTO'
  /api/v1/auth/refresh:
    post:
      tags:
      - auth-rest-controller
      operationId: refreshToken
      parameters:
      - name: RefreshToken
        in: cookie
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /api/v1/auth/logout:
    post:
      tags:
      - auth-rest-controller
      operationId: logOut
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /api/v1/auth/login:
    post:
      tags:
      - auth-rest-controller
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /api/v1/courses/{courseId}/status:
    patch:
      tags:
      - course-player-rest-controller
      operationId: updateEnrollmentStatus
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: boolean
        required: true
      responses:
        "200":
          description: OK
  /api/v1:
    get:
      tags:
      - main-rest-controller
      operationId: getPopularCourses
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseBasicDTO'
  /api/v1/users:
    get:
      tags:
      - admin-user-rest-controller
      operationId: getAllUsers
      parameters:
      - name: pageable
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Pageable'
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PageUserDTO'
  /api/v1/users/me/enrollments:
    get:
      tags:
      - user-rest-controller
      operationId: getMyEnrollments
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnrollmentBasicDTO'
  /api/v1/courses/{id}/users:
    get:
      tags:
      - admin-course-rest-controller
      operationId: getEnrolledUsers
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserDTO'
  /api/v1/users/me/enrollments/{courseId}:
    delete:
      tags:
      - user-rest-controller
      operationId: cancelEnrollment
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
  /api/v1/courses/{courseId}/users/{userId}:
    delete:
      tags:
      - admin-course-rest-controller
      operationId: removeUserFromCourse
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
  /api/v1/courses/{courseId}/lessons/{id}:
    delete:
      tags:
      - lesson-rest-controller
      operationId: deleteLesson
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
  /error:
    get:
      tags:
      - rest-error-controller
      operationId: handleApiError
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessageDTO'
    put:
      tags:
      - rest-error-controller
      operationId: handleApiError_3
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessageDTO'
    post:
      tags:
      - rest-error-controller
      operationId: handleApiError_2
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessageDTO'
    delete:
      tags:
      - rest-error-controller
      operationId: handleApiError_5
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessageDTO'
    options:
      tags:
      - rest-error-controller
      operationId: handleApiError_6
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessageDTO'
    head:
      tags:
      - rest-error-controller
      operationId: handleApiError_1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessageDTO'
    patch:
      tags:
      - rest-error-controller
      operationId: handleApiError_4
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessageDTO'
components:
  schemas:
    UserBasicDTO:
      type: object
      properties:
        fullname:
          type: string
    UserDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        roles:
          type: array
          items:
            type: string
    CourseBasicDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        level:
          type: string
        price:
          type: number
          format: double
        creatorName:
          type: string
        studentCount:
          type: integer
          format: int32
    CourseDetailDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        level:
          type: string
        price:
          type: number
          format: double
        syllabusFileName:
          type: string
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/LessonDTO'
    LessonDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        content:
          type: string
        videoUrl:
          type: string
        durationInMinutes:
          type: integer
          format: int32
    EnrollmentDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        userFullName:
          type: string
        courseId:
          type: integer
          format: int64
        courseTitle:
          type: string
        enrollmentDate:
          type: string
          format: date
        completed:
          type: boolean
    CheckoutDTO:
      type: object
      properties:
        courseIds:
          type: array
          items:
            type: integer
            format: int64
    UserRegistrationDTO:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        password:
          type: string
    AuthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - SUCCESS
          - FAILURE
        message:
          type: string
        error:
          type: string
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
    Pageable:
      type: object
      properties:
        page:
          minimum: 0
          type: integer
          format: int32
        size:
          minimum: 1
          type: integer
          format: int32
        sort:
          type: array
          items:
            type: string
    PageUserDTO:
      type: object
      properties:
        totalPages:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: '#/components/schemas/UserDTO'
        number:
          type: integer
          format: int32
        sort:
          $ref: '#/components/schemas/SortObject'
        first:
          type: boolean
        last:
          type: boolean
        numberOfElements:
          type: integer
          format: int32
        pageable:
          $ref: '#/components/schemas/PageableObject'
        empty:
          type: boolean
    PageableObject:
      type: object
      properties:
        offset:
          type: integer
          format: int64
        sort:
          $ref: '#/components/schemas/SortObject'
        paged:
          type: boolean
        unpaged:
          type: boolean
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
    SortObject:
      type: object
      properties:
        empty:
          type: boolean
        unsorted:
          type: boolean
        sorted:
          type: boolean
    EnrollmentBasicDTO:
      type: object
      properties:
        userFullName:
          type: string
        courseTitle:
          type: string
        enrollmentDate:
          type: string
          format: date
        completed:
          type: boolean
    PageCourseBasicDTO:
      type: object
      properties:
        totalPages:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: '#/components/schemas/CourseBasicDTO'
        number:
          type: integer
          format: int32
        sort:
          $ref: '#/components/schemas/SortObject'
        first:
          type: boolean
        last:
          type: boolean
        numberOfElements:
          type: integer
          format: int32
        pageable:
          $ref: '#/components/schemas/PageableObject'
        empty:
          type: boolean
    CourseProgressDTO:
      type: object
      properties:
        course:
          $ref: '#/components/schemas/CourseDetailDTO'
        isCompleted:
          type: boolean
        currentLessonId:
          type: integer
          format: int64
    ErrorMessageDTO:
      type: object
      properties:
        statusCode:
          type: integer
          format: int32
        message:
          type: string
        description:
          type: string
        timestamp:
          type: string
          format: date-time
